{% extends 'base.html' %}
{% set ep = request.endpoint or '' %}
{% block title %}Add User — Admin{% endblock %}
{% block page_title %}Add New User{% endblock %}

{% block content %}
<div class="mb-3">
  <a href="{{ url_for('admin.index') }}" class="text-muted text-decoration-none" style="font-size:.875rem">
    <i class="bi bi-arrow-left me-1"></i>Back to Admin Panel
  </a>
</div>
<div class="card form-card">
  <div class="card-body">
    <h5 class="fw-bold mb-1">Create New User</h5>
    <p class="text-muted mb-4" style="font-size:.875rem">Add a team member and set their access level.</p>
    <form method="POST">
      <div class="row g-3 mb-3">
        <div class="col-sm-6">
          <label class="form-label">Full Name <span class="text-danger">*</span></label>
          <input type="text" name="full_name" class="form-control" placeholder="Jane Smith" required>
        </div>
        <div class="col-sm-6">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" placeholder="jane@company.com">
        </div>
      </div>
      <div class="row g-3 mb-3">
        <div class="col-sm-6">
          <label class="form-label">Username <span class="text-danger">*</span></label>
          <input type="text" name="username" class="form-control" placeholder="janesmith" required>
        </div>
        <div class="col-sm-6">
          <label class="form-label">Password <span class="text-danger">*</span></label>
          <input type="password" name="password" class="form-control" placeholder="Min 6 characters" required minlength="6">
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label">Role</label>
        <select name="role" class="form-select">
          <option value="employee">Employee — assigned to projects, updates tasks</option>
          <option value="manager">Manager — creates projects, assigns tasks, approves requests</option>
          <option value="admin">Admin — full access including user management</option>
        </select>
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-accent px-4 fw-semibold">
          <i class="bi bi-person-plus me-1"></i>Create User
        </button>
        <a href="{{ url_for('admin.index') }}" class="btn btn-light px-4">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
